<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="機材管理">
  <title>ギター機材管理</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1>機材管理</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <input id="search" type="search" placeholder="メーカー・モデル名で検索" autocomplete="off">
    </div>
  </header>

  <main id="list" class="list" aria-live="polite"></main>

  <button id="addBtn" class="fab" aria-label="機材を追加">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="カテゴリ"></nav>

  <!-- 登録・編集シート -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <form id="form" novalidate>
      <div class="sheet-header">
        <button type="button" class="link" id="cancelBtn">キャンセル</button>
        <h2 id="sheetTitle">機材を追加</h2>
        <button type="submit" class="link strong">保存</button>
      </div>
      <div class="sheet-body">
        <div class="photo-card">
          <div class="photo-preview" id="photoPreview" hidden>
            <img id="photoImg" alt="機材の写真">
            <button type="button" class="photo-remove" id="photoRemove" aria-label="写真を外す">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
            </button>
          </div>
          <div class="photo-actions">
            <label class="photo-btn">
              <input type="file" accept="image/*" capture="environment" id="photoCamera" class="visually-hidden">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1.8 2H20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3.2Zm3 5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg>
              撮影
            </label>
            <label class="photo-btn">
              <input type="file" accept="image/*" id="photoLibrary" class="visually-hidden">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v9.6l4.3-4.3 3.2 3.2 4.2-4.2L20 14.6V6Zm4.5 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
              写真を選択
            </label>
          </div>
          <button type="button" class="ai-btn" id="aiBtn" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2l1.6 5.4L20 9v2l-5.4 1.6L13 18h-2l-1.6-5.4L4 11V9l5.4-1.6ZM18 15h1.4l.6 2 2 .6V19l-2 .6-.6 2H18l-.6-2-2-.6v-1.4l2-.6Z"/></svg>
            <span>写真からAIで判定</span>
          </button>
          <p class="ai-status" id="aiStatus" role="status" hidden></p>
        </div>

        <div class="segment" id="categorySegment" role="radiogroup" aria-label="カテゴリ"></div>

        <div class="group">
          <label class="row">
            <span>メーカー</span>
            <input name="brand" placeholder="例: Fender" autocomplete="off">
          </label>
          <label class="row">
            <span>モデル名<em>*</em></span>
            <input name="model" placeholder="例: Stratocaster" autocomplete="off" required>
          </label>
          <label class="row">
            <span>型番</span>
            <input name="modelNumber" placeholder="例: TS9" autocomplete="off" autocapitalize="characters">
          </label>
          <label class="row">
            <span>種類</span>
            <select name="type" id="typeSelect"></select>
          </label>
          <label class="row">
            <span>色</span>
            <input name="color" placeholder="例: サンバースト" autocomplete="off">
          </label>
        </div>

        <div class="group">
          <label class="row">
            <span>状態</span>
            <select name="status">
              <option value="active">使用中</option>
              <option value="stored">保管中</option>
              <option value="repair">修理中</option>
              <option value="sold">売却済み</option>
            </select>
          </label>
          <label class="row">
            <span>購入日</span>
            <input name="purchaseDate" type="date">
          </label>
          <label class="row">
            <span>購入価格</span>
            <input name="price" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="円">
          </label>
          <label class="row">
            <span>シリアル</span>
            <input name="serial" autocomplete="off" autocapitalize="characters">
          </label>
        </div>

        <div class="group">
          <label class="row col">
            <span>特徴</span>
            <textarea name="features" rows="2" placeholder="例: ローズウッド指板、SSS配列"></textarea>
          </label>
          <label class="row col">
            <span>メモ</span>
            <textarea name="notes" rows="4" placeholder="弦のゲージ、セッティング、修理履歴など"></textarea>
          </label>
        </div>

        <p class="error" id="formError" hidden></p>

        <button type="button" class="danger" id="deleteBtn" hidden>この機材を削除</button>
      </div>
    </form>
  </section>

  <!-- 削除確認 -->
  <div class="alert-backdrop" id="confirm" hidden>
    <div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">削除しますか？</h3>
      <p id="confirmText"></p>
      <div class="alert-actions">
        <button type="button" id="confirmCancel">キャンセル</button>
        <button type="button" id="confirmOk" class="destructive">削除</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="photo-store.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
